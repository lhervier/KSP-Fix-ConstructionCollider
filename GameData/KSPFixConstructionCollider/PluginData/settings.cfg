// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// Makes a part released in EVA construction mode collide again, even when it was switched between the Move and
// Rotate tools while selected. On stock, such a part is released with its colliders turned into triggers: it no
// longer collides with anything, the ground included, until the game is loaded again, and a structure standing
// on it sinks into the ground.
releasedPartCollides = True

// How much the mod writes to KSP.log: Error, Warning, Info or Debug. At Debug, one line each time the fix puts
// back the colliders of a part the construction mode was about to record as triggers.
logLevel = Info
